# Fly.io config for the Knot backend.
#
# The database is CockroachDB Cloud in aws-ap-south-1, so the app runs in the
# same region — a serializable ledger does a read and a write in one
# transaction, and crossing an ocean between them is felt on every request.
app = "knot-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Zero is deliberate: this is a judged demo on a small budget, and a cold
  # start costs a second while an always-on machine costs money every hour.
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
